# Builds the Dockerfile image and deploys it. Split out from a plain
# `gcloud builds submit --tag` because the build itself needs a reachable
# DATABASE_URL: `next build` calls generateStaticParams() in
# src/app/(public)/[slug]/page.tsx, which queries Postgres for every
# published slug to pre-render — exactly what happened on Railway, whose
# build reached Postgres over its public proxy. Database is Neon (not Cloud
# SQL — only compute moved to GCP), so the same DATABASE_URL secret used at
# runtime also works as the build arg: Neon's connection string is already a
# public, SSL-required endpoint, no extra networking needed either way.
#
# Substitutions to set when triggering (see the runbook):
#   _REGION, _ARTIFACT_REPO, _CLOUD_RUN_SERVICE

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: ['DATABASE_URL']
    args:
      - -c
      - |
        set -e
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/creator-platform:$BUILD_ID"
        docker build \
          --build-arg DATABASE_URL="$$DATABASE_URL" \
          -t "$$IMAGE" \
          .
        echo "$$IMAGE" > /workspace/image.txt

  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - docker push "$(cat /workspace/image.txt)"

  - id: deploy-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy "${_CLOUD_RUN_SERVICE}" \
          --image="$(cat /workspace/image.txt)" \
          --region="${_REGION}" \
          --quiet

  - id: deploy-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run jobs update publish-run-tier \
          --image="$(cat /workspace/image.txt)" \
          --region="${_REGION}" \
          --quiet

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL

options:
  logging: CLOUD_LOGGING_ONLY

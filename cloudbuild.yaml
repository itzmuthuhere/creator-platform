# Builds the Dockerfile image and deploys it. Split out from a plain
# `gcloud builds submit --tag` because the build itself needs a reachable
# DATABASE_URL: `next build` calls generateStaticParams() in
# src/app/(public)/[slug]/page.tsx, which queries Postgres for every
# published slug to pre-render — exactly what happened on Railway, whose
# build reached Postgres over its public proxy. Mirrors that here: Cloud SQL
# needs a public IP with --require-ssl, and the DB password used only for
# this build-time query comes from Secret Manager, never written to the repo.
#
# Substitutions to set when triggering (see the runbook):
#   _REGION, _ARTIFACT_REPO, _CLOUD_RUN_SERVICE, _SQL_INSTANCE_CONNECTION_NAME,
#   _SQL_PUBLIC_IP, _DB_NAME, _DB_USER

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: ['DB_BUILD_PASSWORD']
    args:
      - -c
      - |
        set -e
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/creator-platform:${SHORT_SHA}"
        docker build \
          --build-arg DATABASE_URL="postgresql://${_DB_USER}:${DB_BUILD_PASSWORD}@${_SQL_PUBLIC_IP}:5432/${_DB_NAME}?sslmode=require" \
          -t "$$IMAGE" \
          .
        echo "$$IMAGE" > /workspace/image.txt

  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - docker push "$(cat /workspace/image.txt)"

  - id: deploy-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy "${_CLOUD_RUN_SERVICE}" \
          --image="$(cat /workspace/image.txt)" \
          --region="${_REGION}" \
          --quiet

  - id: deploy-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run jobs update publish-run-tier \
          --image="$(cat /workspace/image.txt)" \
          --region="${_REGION}" \
          --quiet

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DB_BUILD_PASSWORD/versions/latest
      env: DB_BUILD_PASSWORD

options:
  logging: CLOUD_LOGGING_ONLY

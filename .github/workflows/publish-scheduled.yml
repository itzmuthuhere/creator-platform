name: Publish scheduled posts

on:
  schedule:
    # Every 30 minutes. Railway has no built-in "hit this URL on schedule"
    # for a web service, so GitHub Actions triggers it instead — works no
    # matter which host the site ends up on.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call publish-scheduled endpoint
        run: |
          curl -sf -X GET "https://techpulzo.in/api/cron/publish-scheduled" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

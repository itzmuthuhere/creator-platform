name: Publish scheduled posts

on:
  # Schedule trigger disabled 2026-08-17 pending editorial review of the
  # scheduled-post queue (see reports/11-final-submission-gate.md) — two
  # HOLD-FROM-PUBLICATION articles already auto-published unremediated
  # before this was caught. Re-enable the `schedule:` block below only on
  # explicit instruction; workflow_dispatch is left so it can still be run
  # manually for a single, deliberate batch if ever needed.
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call publish-scheduled endpoint
        run: |
          curl -sf -X GET "https://techpulzo.in/api/cron/publish-scheduled" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
